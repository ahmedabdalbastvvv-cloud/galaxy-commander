scene.background=new THREE.Color(0x020611);

function mat(color,metalness=.7,roughness=.3,emissive=0){
 return new THREE.MeshStandardMaterial({color,metalness,roughness,emissive});
}
function box(parent,w,h,d,color,x,y,z,material=null){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material||mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}
function sphere(parent,r,color,x,y,z,material=null){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),material||mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}
function cylinder(parent,a,b,h,color,x,y,z,material=null){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,12),material||mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}

/* نظام الصوت السينمائي */
let audioContext=null;
let soundEnabled=true;
let lastEnemySound=0;

function initAudio(){
 if(!audioContext){
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(AudioClass)audioContext=new AudioClass();
 }
 if(audioContext&&audioContext.state==="suspended")audioContext.resume();
}
function playTone(startFreq,endFreq,duration,volume,type="sawtooth"){
 if(!soundEnabled)return;
 initAudio();
 if(!audioContext)return;
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();
 const now=audioContext.currentTime;
 osc.type=type;
 osc.frequency.setValueAtTime(startFreq,now);
 osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+duration);
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+duration);
 osc.connect(gain);gain.connect(audioContext.destination);
 osc.start(now);osc.stop(now+duration);
}
function weaponNoise(duration,volume,lowpass,highpass=80){
 if(!soundEnabled)return;
 initAudio();if(!audioContext)return;
 const length=Math.floor(audioContext.sampleRate*duration);
 const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=audioContext.createBufferSource();source.buffer=buffer;
 const filter=audioContext.createBiquadFilter();
 filter.type="lowpass";
 filter.frequency.setValueAtTime(lowpass,audioContext.currentTime);
 filter.frequency.exponentialRampToValueAtTime(highpass,audioContext.currentTime+duration);
 const gain=audioContext.createGain();
 gain.gain.setValueAtTime(volume,audioContext.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
 source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
 source.start();
}
function soundLaser(){
 if(!soundEnabled)return;
 playTone(1250,120,.17,.075,"sawtooth");
 weaponNoise(.11,.09,4500,500);
 playTone(180,65,.12,.045,"triangle");
}
function soundMissile(){
 if(!soundEnabled)return;
 playTone(160,35,.8,.15,"sawtooth");
 weaponNoise(.7,.16,1200,100);
 setTimeout(()=>{
  if(soundEnabled){
   playTone(95,25,.45,.12,"triangle");
   weaponNoise(.35,.12,700,90);
  }
 },120);
}
function soundEnemyShot(){
 if(!soundEnabled)return;
 const now=Date.now();
 if(now-lastEnemySound<130)return;
 lastEnemySound=now;
 playTone(520,75,.23,.055,"square");
 weaponNoise(.16,.045,1800,200);
}
function soundExplosion(){
 if(!soundEnabled)return;
 playTone(100,25,.45,.15,"sawtooth");
 weaponNoise(.5,.23,1100,55);
 setTimeout(()=>{if(soundEnabled)weaponNoise(.3,.1,500,50)},80);
}
document.getElementById("soundToggle").onclick=()=>{
 soundEnabled=!soundEnabled;
 document.getElementById("soundToggle").textContent=soundEnabled?"🔊 الصوت: يعمل":"🔇 الصوت: متوقف";
 if(soundEnabled){initAudio();soundLaser()}
};

function makePlanetTexture(kind){
 const canvas=document.createElement("canvas");canvas.width=512;canvas.height=256;
 const ctx=canvas.getContext("2d");
 const palettes=[["#776d65","#b5a99b","#4a4542"],["#b58c54","#e0c18a","#806344"],["#07518a","#2d9b67","#d6d2bb"],["#8c3b24","#c36b42","#54251d"],["#9b744e","#d6b68a","#735438"],["#bca77e","#e4d7ad","#8b795d"],["#4c9ba0","#83d0d0","#27616c"],["#183d9c","#4777d8","#101c58"]];
 const colors=palettes[kind];
 const grad=ctx.createLinearGradient(0,0,0,256);
 grad.addColorStop(0,colors[1]);grad.addColorStop(.5,colors[0]);grad.addColorStop(1,colors[2]);
 ctx.fillStyle=grad;ctx.fillRect(0,0,512,256);
 if(kind===1||kind===4||kind===5||kind===7){
  for(let i=0;i<100;i++){const y=Math.random()*256;ctx.fillStyle=colors[Math.floor(Math.random()*3)];ctx.globalAlpha=.12+Math.random()*.25;ctx.fillRect(0,y,512,2+Math.random()*12)}
 }else{
  for(let i=0;i<180;i++){const x=Math.random()*512,y=Math.random()*256,rx=5+Math.random()*30,ry=3+Math.random()*13;ctx.globalAlpha=.18+Math.random()*.35;ctx.fillStyle=colors[Math.floor(Math.random()*3)];ctx.beginPath();ctx.ellipse(x,y,rx,ry,Math.random(),0,Math.PI*2);ctx.fill()}
 }
 if(kind===2){
  for(let i=0;i<45;i++){const x=Math.random()*512,y=Math.random()*256;ctx.fillStyle=i%3?"#328b50":"#c9bd91";ctx.globalAlpha=.8;ctx.beginPath();ctx.ellipse(x,y,8+Math.random()*25,5+Math.random()*18,Math.random(),0,Math.PI*2);ctx.fill()}
 }
 ctx.globalAlpha=1;
 for(let i=0;i<9000;i++){ctx.fillStyle=Math.random()>.5?"#ffffff":"#000000";ctx.globalAlpha=Math.random()*.12;ctx.fillRect(Math.random()*512,Math.random()*256,1,1)}
 ctx.globalAlpha=1;
 const texture=new THREE.CanvasTexture(canvas);
 texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.ClampToEdgeWrapping;texture.encoding=THREE.sRGBEncoding;
 return texture;
}

const starCount=1500,starPositions=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){const k=i*3;starPositions[k]=(Math.random()-.5)*900;starPositions[k+1]=(Math.random()-.5)*520;starPositions[k+2]=-Math.random()*1000}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute("position",new THREE.BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xdaf4ff,size:1.15,transparent:true,opacity:.85,sizeAttenuation:true}));
scene.add(stars);

const sun=new THREE.Mesh(new THREE.SphereGeometry(19,48,32),new THREE.MeshBasicMaterial({color:0xffa51e}));
sun.position.set(-60,30,-270);solarSystem.add(sun);
const sunGlow=new THREE.PointLight(0xffa52b,3,500);sunGlow.position.copy(sun.position);solarSystem.add(sunGlow);

const planetData=[
{name:"عطارد",r:9,x:-95,y:18,z:-145,kind:0},
{name:"الزهرة",r:13,x:95,y:42,z:-220,kind:1},
{name:"الأرض",r:17,x:-115,y:-38,z:-310,kind:2},
{name:"المريخ",r:13,x:125,y:-40,z:-405,kind:3},
{name:"المشتري",r:27,x:145,y:55,z:-535,kind:4},
{name:"زحل",r:23,x:-155,y:55,z:-650,kind:5},
{name:"أورانوس",r:18,x:170,y:-60,z:-770,kind:6},
{name:"نبتون",r:20,x:-175,y:-60,z:-900,kind:7}
];
const planets=[];
planetData.forEach((p,i)=>{
 const g=new THREE.Group(),texture=makePlanetTexture(p.kind);
 const ball=new THREE.Mesh(new THREE.SphereGeometry(p.r,48,32),new THREE.MeshStandardMaterial({map:texture,roughness:.9,metalness:.02}));
 g.add(ball);

  const ring=new THREE.Mesh(new THREE.RingGeometry(p.r*(i===5?1.35:1.35),p.r*(i===5?2.05:1.65),96),new THREE.MeshStandardMaterial({color:i===5?0xcab78a:0x83c8c9,side:THREE.DoubleSide,transparent:true,opacity:i===5?.72:.35,roughness:1}));
  ring.rotation.x=-Math.PI/2.5;g.add(ring);
 }
 g.position.set(p.x,p.y,p.z);g.userData.orbitSpeed=.0002+i*.000025;solarSystem.add(g);planets.push(g);
});

const regions=[
{name:"مدار الأرض",color:0x020b20},
{name:"المريخ الأحمر",color:0x160914},
{name:"المجرة الزرقاء",color:0x04152a},

{name:"FALCON",price:0,color:0x36cfff,scale:1,hp:100,damage:1,speed:1},
{name:"BLUE HAWK",price:5000,color:0x247bff,scale:1.08,hp:115,damage:1.2,speed:1.08},

{name:"DESTROYER",price:160000,color:0xff4747,scale:1.4,hp:220,damage:2.8,speed:1.12},
{name:"STORM",price:320000,color:0xffd43b,scale:1.48,hp:250,damage:3.2,speed:1.2},
{name:"GALAXY X",price:640000,color:0xff58e8,scale:1.55,hp:290,damage:3.8,speed:1.22},
{name:"OMEGA",price:1280000,color:0xffffff,scale:1.7,hp:350,damage:4.5,speed:1.25}
];

let coins=0,bestStage=1,selectedShip=0,selectedRegion=0,selectedStage=1;
let missileCount=4,megaMissileCount=0,laserLevel=1,shieldCount=2;
let score=0,roundScore=0,energy=100,stage=1,stageTarget=1100;
let started=false,paused=false,gameOver=false,stageWaiting=false;
let shootTimer=0,spawnTimer=50,stageTimer=0;
let joystickX=0,joystickY=0,firing=false;
const keys={};let unlockedShips=[0];

try{
 coins=Number(localStorage.getItem("gc_coins"))||0;
 bestStage=Math.max(1,Number(localStorage.getItem("gc_best"))||1);
 selectedShip=Number(localStorage.getItem("gc_ship"))||0;
 const savedMissiles=localStorage.getItem("gc_missiles");
 missileCount=savedMissiles===null?4:Math.max(4,Number(savedMissiles)||4);
 megaMissileCount=Number(localStorage.getItem("gc_mega"))||0;
 laserLevel=Number(localStorage.getItem("gc_laser"))||1;
 shieldCount=Number(localStorage.getItem("gc_shield"))||2;
 const saved=JSON.parse(localStorage.getItem("gc_unlocked")||"[0]");
 if(Array.isArray(saved))unlockedShips=saved;
}catch(e){}
if(!unlockedShips.includes(0))unlockedShips.unshift(0);
selectedShip=Math.max(0,Math.min(9,selectedShip));

function saveData(){
 try{
  localStorage.setItem("gc_coins",coins);localStorage.setItem("gc_best",bestStage);
  localStorage.setItem("gc_ship",selectedShip);localStorage.setItem("gc_missiles",missileCount);
  localStorage.setItem("gc_mega",megaMissileCount);localStorage.setItem("gc_laser",laserLevel);
  localStorage.setItem("gc_shield",shieldCount);localStorage.setItem("gc_unlocked",JSON.stringify(unlockedShips));
 }catch(e){}
}

function addMountedMissile(parent,side,scale){
 const group=new THREE.Group(),bodyMat=mat(0xdce9f5,.9,.2),noseMat=mat(0xffa52b,.6,.25,0x552000),finMat=mat(0x25394e,.85,.2);
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.24,.29,2.8,14),bodyMat);body.rotation.x=Math.PI/2;group.add(body);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.29,.85,14),noseMat);nose.rotation.x=-Math.PI/2;nose.position.z=-1.8;group.add(nose);
 for(let a=0;a<4;a++){const fin=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.65),finMat),angle=a*Math.PI/2;fin.position.set(Math.cos(angle)*.32,Math.sin(angle)*.32,1);fin.rotation.z=angle;group.add(fin)}
 const band=new THREE.Mesh(new THREE.TorusGeometry(.3,.055,8,16),finMat);band.rotation.x=Math.PI/2;band.position.z=.55;group.add(band);
 group.position.set(side*2.45,.02,0);group.scale.setScalar(scale);parent.add(group);
}
function buildPlayerShip(index){
 const data=shipData[index],g=new THREE.Group(),armor=mat(data.color,.92,.2,data.color),dark=mat(0x172638,.9,.25),steel=mat(0x9eb8ce,.95,.2);
 const glass=new THREE.MeshStandardMaterial({color:0x65eaff,metalness:.5,roughness:.1,emissive:0x087bff,emissiveIntensity:1.4});
 const glow=new THREE.MeshBasicMaterial({color:0xff8b22});
 const flameMats=[new THREE.MeshBasicMaterial({color:0xff3c12}),new THREE.MeshBasicMaterial({color:0xffa31c}),new THREE.MeshBasicMaterial({color:0xffffa1})];
 const hull=new THREE.Mesh(new THREE.CylinderGeometry(.48,.85,5.9,10),armor);hull.rotation.x=-Math.PI/2;g.add(hull);

function removeObject(obj){
 if(!obj)return;if(obj.parent)obj.parent.remove(obj);
 obj.traverse?.(child=>{if(child.geometry)child.geometry.dispose();if(child.material){if(Array.isArray(child.material))child.material.forEach(m=>m.dispose());else child.material.dispose()}});
}
function clearArray(arr){while(arr.length)removeObject(arr.pop())}

function spawnPickup(position){
 const type=Math.floor(Math.random()*5),colors=[0x00ffff,0x00ff66,0xffcc22,0xff55ff,0xff5010];
 const p=new THREE.Mesh(new THREE.OctahedronGeometry(type===4?.85:.5,1),new THREE.MeshStandardMaterial({color:colors[type],emissive:colors[type],emissiveIntensity:.8}));
 p.position.copy(position);p.userData.type=type;p.userData.speed=.12;scene.add(p);pickups.push(p);
}
function explosion(position,color=0xff7722,size=1){
 soundExplosion();const g=new THREE.Group();g.position.copy(position);const particles=[];
 for(let i=0;i<24;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.12,7,6),new THREE.MeshBasicMaterial({color:i%4===0?0xffffff:color,transparent:true}));p.userData.velocity=new THREE.Vector3((Math.random()-.5)*.3,(Math.random()-.5)*.3,(Math.random()-.5)*.3);g.add(p);particles.push(p)}
 g.scale.setScalar(size);scene.add(g);effects.push({group:g,particles,life:35});
}
function updateEffects(){
 for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life--;e.particles.forEach(p=>{p.position.add(p.userData.velocity);p.scale.multiplyScalar(.97);p.material.opacity=Math.max(0,e.life/35)});if(e.life<=0){removeObject(e.group);effects.splice(i,1)}}
}
function destroyEnemy(e){
 const idx=enemies.indexOf(e);if(idx<0)return;
 const pos=e.position.clone();explosion(pos,0xff762b,1.4);score+=e.userData.points;roundScore+=e.userData.points;
 addCoins(e.userData.points>=90?12:5);removeObject(e);enemies.splice(idx,1);
 if(Math.random()<.4)spawnPickup(pos);
 if(roundScore>=stageTarget)stageComplete();updateHUD();
}
function damageEnemy(e,damage,volleyId){
 if(!enemies.includes(e))return;
 // الليزرين اللذان يخرجان في نفس الضغطة يُحسبان ضربة واحدة
 if(volleyId!==undefined){
  if(e.userData.lastVolley===volleyId)return;
  e.userData.lastVolley=volleyId;e.userData.hp-=1;
 }else{
  e.userData.hp-=damage;
 }
 updateHealthBar(e);if(e.userData.hp<=0)destroyEnemy(e);
}
function distance(a,b){return a.position.distanceTo(b.position)}
function damagePlayer(amount){
 if(shieldMesh)return;energy=Math.max(0,energy-amount);updateHUD();if(energy<=0)finishGame();
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const delta=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
 const positions=stars.geometry.attributes.position.array,starSpeed=started&&!paused?.32:.035;
 for(let i=0;i<starCount;i++){const k=i*3;positions[k+2]+=starSpeed;if(positions[k+2]>20)positions[k+2]=-1000}
 stars.geometry.attributes.position.needsUpdate=true;
 planets.forEach(p=>p.rotation.y+=p.userData.orbitSpeed);sun.rotation.y+=.0002;
 if(ship.userData.flames)ship.userData.flames.forEach((f,i)=>{const pulse=.8+Math.sin(time*18+i*2)*.22;f.scale.set(1,pulse,1)});
 if(started&&!paused&&!gameOver){
  const stats=shipData[selectedShip],speed=10*stats.speed*delta;
  ship.position.z=6-Math.sin(time*1.4)*.22;camera.position.z=16-Math.sin(time*1.4)*.22;
  let mx=joystickX,my=joystickY;
  if(keys.arrowleft||keys.a)mx=-1;if(keys.arrowright||keys.d)mx=1;if(keys.arrowup||keys.w)my=1;if(keys.arrowdown||keys.s)my=-1;
  ship.position.x+=mx*speed;ship.position.y+=my*speed;
  ship.position.x=Math.max(-7.2,Math.min(7.2,ship.position.x));ship.position.y=Math.max(-4.5,Math.min(1.5,ship.position.y));
  ship.rotation.z=-mx*.22;ship.rotation.x=-my*.1;
  if(firing)shoot();if(shootTimer>0)shootTimer--;
  if(shieldMesh){shieldMesh.userData.life--;shieldMesh.rotation.y+=.05;shieldMesh.rotation.x+=.02;if(shieldMesh.userData.life<=0){ship.remove(shieldMesh);removeObject(shieldMesh);shieldMesh=null}}
  if(stageWaiting){
   stageTimer-=delta;
   if(stageTimer<=0){
    if(stage===1||stage>=40)winGame();
    else{stage++;selectedStage=stage;roundScore=0;stageTarget=1100+(stage-1)*100;energy=Math.min(stats.hp,energy+25);stageWaiting=false;spawnTimer=Math.max(25,70-stage);message.textContent="المرحلة "+stage+" - مستوى أصعب!";updateHUD()}
   }
  }
  if(!stageWaiting){spawnTimer--;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(14,75-stage*1.8)}}
  for(let i=playerLasers.length-1;i>=0;i--){
   const l=playerLasers[i];l.position.z-=l.userData.speed;let hit=false;
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(distance(l,e)<2.5){damageEnemy(e,stats.damage*(1+laserLevel*.35),l.userData.volleyId);hit=true;break}
   }
   if(hit||l.position.z<-150){removeObject(l);playerLasers.splice(i,1)}
  }
  for(let i=missiles.length-1;i>=0;i--){
   const m=missiles[i];m.position.z-=m.userData.speed;
   if(m.userData.flame){const pulse=.8+Math.sin(time*25+i*2)*.22;m.userData.flame.scale.set(1,pulse,1)}
   let target=null,nearest=Infinity;
   enemies.forEach(e=>{const d=distance(m,e);if(d<nearest){nearest=d;target=e}});
   if(target){const aim=target.position.clone();m.position.lerp(aim,m.userData.mega?.11:.07)}
   if(target&&nearest<(m.userData.mega?5:2)){
    const pos=target.position.clone(),isMega=m.userData.mega;explosion(pos,isMega?0xff3b08:0xffbd29,isMega?4:2);
    enemies.slice().forEach(e=>{if(e.position.distanceTo(pos)<(isMega?15:5))damageEnemy(e,isMega?45+laserLevel*8:8+laserLevel*2)});
    removeObject(m);missiles.splice(i,1);
   }else if(m.position.z<-150){removeObject(m);missiles.splice(i,1)}
  }
  for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i],targetX=ship.position.x*.72,targetY=ship.position.y*.72;
   e.position.x+=(targetX-e.position.x)*.005+Math.sin(time*1.5+e.userData.phase)*.018;
   e.position.y+=(targetY-e.position.y)*.005+Math.cos(time+e.userData.phase)*.012;
   e.position.z+=e.userData.speed;e.rotation.y=Math.PI;e.rotation.z=Math.sin(time+e.userData.phase)*.12;
   e.userData.shoot--;
   if(e.userData.shoot<=0){enemyShoot(e);e.userData.shoot=Math.max(18,55-stage*1.2)}
   if(distance(e,ship)<3.8){damagePlayer(18+stage*.4);explosion(e.position,0xff3333,1.2);removeObject(e);enemies.splice(i,1)}
   else if(e.position.z>12){removeObject(e);enemies.splice(i,1)}
  }
  for(let i=enemyLasers.length-1;i>=0;i--){
   const l=enemyLasers[i];l.position.add(l.userData.velocity);
   if(distance(l,ship)<1.6){damagePlayer(9+stage*.15);explosion(l.position,0xff3333,.6);removeObject(l);enemyLasers.splice(i,1)}
   else if(l.position.z>18||Math.abs(l.position.x)>35||Math.abs(l.position.y)>25){removeObject(l);enemyLasers.splice(i,1)}
  }
  for(let i=pickups.length-1;i>=0;i--){
   const p=pickups[i];p.position.z+=p.userData.speed;p.rotation.x+=.05;p.rotation.y+=.07;
   if(distance(p,ship)<2.5){
    if(p.userData.type===0){laserLevel=Math.min(8,laserLevel+1);message.textContent="⚡ قوة الليزر زادت!"}
    if(p.userData.type===1){energy=Math.min(stats.hp,energy+35);message.textContent="❤️ تم إصلاح الطائرة!"}
    if(p.userData.type===2){missileCount=Math.max(4,missileCount)+2;message.textContent="🚀 صواريخ إضافية! الرصيد: "+missileCount}
    if(p.userData.type===3){addCoins(30);message.textContent="💰 مكافأة +30 عملة!"}
    if(p.userData.type===4){megaMissileCount++;message.textContent="💥 حصلت على صاروخ عملاق!"}
    saveData();removeObject(p);pickups.splice(i,1);updateHUD();
   }else if(p.position.z>14){removeObject(p);pickups.splice(i,1)}
  }
  if(stageWaiting)message.textContent="STAGE "+stage+" COMPLETE!";
  updateEffects();updateHUD();
 }else updateEffects();
 renderer.render(scene,camera);
}
animate();

const stick=document.getElementById("stick"),knob=document.getElementById("knob");
let stickPointer=null;
function moveStick(e){
 const rect=stick.getBoundingClientRect();let dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
 const max=rect.width*.34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}
 joystickX=dx/max;joystickY=-dy/max;knob.style.left=(rect.width/2-22+dx)+"px";knob.style.top=(rect.height/2-22+dy)+"px";
}
function resetStick(){joystickX=0;joystickY=0;stickPointer=null;knob.style.left=(stick.clientWidth/2-22)+"px";knob.style.top=(stick.clientHeight/2-22)+"px"}
stick.addEventListener("pointerdown",e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener("pointermove",e=>{if(stickPointer===e.pointerId)moveStick(e)});
stick.addEventListener("pointerup",resetStick);stick.addEventListener("pointercancel",resetStick);

const fireButton=document.getElementById("fireButton");
fireButton.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();initAudio();firing=true;shoot()});
["pointerup","pointercancel","pointerleave"].forEach(ev=>fireButton.addEventListener(ev,()=>firing=false));

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space"){e.preventDefault();initAudio();firing=true;shoot()}
 if(e.key==="Escape")pauseGame();
});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;if(e.code==="Space")firing=false});

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

createRegion(selectedRegion);
updateHUD();
showMenu();
</script>
</body>
</html>
